name: Godot Smoke Test

on:
  push:
    branches: [godot-campus-horror-starter]
  pull_request:
    branches: [godot-campus-horror-starter]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.3 stable
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

      - name: Import and parse project
        run: |
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            --headless --editor --path . --quit-after 5 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file" /tmp/godot-import.log; then
            echo "Godot import log contains a critical error."
            exit 1
          fi

      - name: Run main scene for 120 frames
        run: |
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            --headless --path . --quit-after 120 2>&1 | tee /tmp/godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file" /tmp/godot-runtime.log; then
            echo "Godot runtime log contains a critical error."
            exit 1
          fi
